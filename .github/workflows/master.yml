name: build-check
on:
  push:
  pull_request:
  workflow_dispatch:

# Sanity check that the site builds. Deployment happens host-side (see deploy/),
# so this needs no secrets and does not publish anything.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.162.1"
          extended: true
      - run: hugo --minify
