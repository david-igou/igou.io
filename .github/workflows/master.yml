name: build-check
on:
  push:
  pull_request:
  workflow_dispatch:

# Sanity check that the site builds. Deployment happens host-side (see deploy/),
# so this needs no secrets and does not publish anything.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.1"
          extended: true
      - run: hugo --minify
