<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" -}}
  <link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ $.Site.Title }}">
  {{- end }}
</head>
<body class="{{ if .IsHome }}home{{ else }}page{{ end }}">
  {{ if not .IsHome }}
  <header class="site-header"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></header>
  {{ end }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ if not .IsHome }}
  <footer class="site-footer">© {{ now.Format "2006" }} {{ .Site.Params.author }} · <a href="{{ "/blog/" | relURL }}">blog</a> · <a href="{{ "index.xml" | relURL }}">rss</a></footer>
  {{ end }}
</body>
</html>
