<script>
"use strict";
//======================================================================
// RIG RUNNER — an RV-service platformer.  Single file, no assets.
// Engine: fixed-timestep canvas 2D.  Audio: Web Audio chiptune.
//======================================================================
const VW=512, VH=288, TS=16, DT=1/60;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
function fitCanvas(){
  const s=Math.max(1,Math.floor(Math.min(window.innerWidth/VW, window.innerHeight/VH)));
  const fs=Math.min(window.innerWidth/VW, window.innerHeight/VH);
  const useInt = fs>=1;
  cv.style.width =(VW*(useInt?s:fs))+"px";
  cv.style.height=(VH*(useInt?s:fs))+"px";
}
window.addEventListener("resize",fitCanvas); fitCanvas();

//---------------------------------------------------------------- input
const keys={l:false,r:false,u:false,d:false,jump:false,act:false,run:false,pause:false};
const kEdge={jump:false,act:false,pause:false,u:false,d:false,l:false,r:false,any:false};
const kmap={
  ArrowLeft:"l", a:"l", A:"l",
  ArrowRight:"r", d:"r", D:"d_r",
  ArrowUp:"u", w:"u", W:"u",
  ArrowDown:"d", s:"d", S:"d",
  z:"jump", Z:"jump", " ":"jump",
  x:"act", X:"act", j:"act", J:"act",
  Shift:"run",
  Enter:"pause"
};
// D maps to right (fix typo-proof): rebuild map cleanly
kmap["d"]="r"; kmap["D"]="r";
window.addEventListener("keydown",e=>{
  audioInit();
  if(e.key==="m"||e.key==="M"){ AU.muted=!AU.muted; if(AU.master)AU.master.gain.value=AU.muted?0:0.5; return; }
  const k=kmap[e.key]; kEdge.any=true;
  if(k){ if(!keys[k]) kEdge[k]=true; keys[k]=true; e.preventDefault(); }
});
window.addEventListener("keyup",e=>{ const k=kmap[e.key]; if(k){keys[k]=false;} });
// touch
if(("ontouchstart" in window)||navigator.maxTouchPoints>0){
  document.getElementById("touch").style.display="block";
  const bind=(id,k)=>{const el=document.getElementById(id);
    el.addEventListener("touchstart",e=>{e.preventDefault();audioInit();kEdge.any=true;if(!keys[k])kEdge[k]=true;keys[k]=true;if(k==="jump"||k==="act")keys.run=true;});
    el.addEventListener("touchend",e=>{e.preventDefault();keys[k]=false;});
    el.addEventListener("touchcancel",e=>{keys[k]=false;});};
  bind("tleft","l");bind("tright","r");bind("tdown","d");bind("tjump","jump");bind("tact","act");bind("tpause","pause");
}

//---------------------------------------------------------------- audio
const AU={ctx:null,master:null,musGain:null,sfxGain:null,muted:false,
  song:null,step:0,nextT:0};
function audioInit(){
  if(AU.ctx) {if(AU.ctx.state==="suspended")AU.ctx.resume(); return;}
  try{
    AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:0.5; AU.master.connect(AU.ctx.destination);
    AU.musGain=AU.ctx.createGain(); AU.musGain.gain.value=0.4; AU.musGain.connect(AU.master);
    AU.sfxGain=AU.ctx.createGain(); AU.sfxGain.gain.value=0.9; AU.sfxGain.connect(AU.master);
    AU.nextT=AU.ctx.currentTime+0.1;
  }catch(e){}
}
function tone(f,dur,type,vol,when,dest,slideTo){
  if(!AU.ctx)return;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(f,when);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),when+dur);
  g.gain.setValueAtTime(vol,when);
  g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  o.connect(g);g.connect(dest||AU.sfxGain);
  o.start(when);o.stop(when+dur+0.02);
}
function noiseBurst(dur,vol,when,fc){
  if(!AU.ctx)return;
  const n=Math.floor(AU.ctx.sampleRate*dur), buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=AU.ctx.createBufferSource(); src.buffer=buf;
  const f=AU.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=fc||3000;
  const g=AU.ctx.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  src.connect(f);f.connect(g);g.connect(AU.sfxGain); src.start(when);
}
const mf=n=>440*Math.pow(2,(n-69)/12);
function now(){return AU.ctx?AU.ctx.currentTime:0;}
const SFX={
  jump(){ tone(300,0.14,"square",0.16,now(),0,600); },
  stomp(){ tone(400,0.12,"square",0.2,now(),0,120); noiseBurst(0.06,0.12,now(),1500); },
  clank(){ tone(1200,0.05,"square",0.12,now(),0,900); noiseBurst(0.04,0.18,now(),6000); },
  ding(){ tone(mf(88),0.06,"triangle",0.22,now()); tone(mf(93),0.10,"triangle",0.22,now()+0.06); },
  big(){ tone(mf(76),0.08,"triangle",0.25,now()); tone(mf(83),0.08,"triangle",0.25,now()+0.07); tone(mf(88),0.16,"triangle",0.25,now()+0.14); },
  power(){ for(let i=0;i<6;i++)tone(mf(64+i*4),0.09,"square",0.14,now()+i*0.055); },
  hurt(){ tone(220,0.25,"sawtooth",0.2,now(),0,60); },
  die(){ for(let i=0;i<8;i++)tone(mf(70-i*3),0.1,"square",0.16,now()+i*0.08); },
  plug(){ tone(90,0.1,"square",0.3,now(),0,55); tone(1600,0.03,"square",0.1,now()+0.09); },
  hiss(){ noiseBurst(0.5,0.05,now(),1200); },
  grind(){ tone(70,0.35,"sawtooth",0.15,now(),0,45); noiseBurst(0.3,0.08,now(),700); },
  pop(){ noiseBurst(0.15,0.3,now(),2500); tone(140,0.1,"square",0.2,now(),0,50); },
  arc(){ tone(1800,0.08,"sawtooth",0.1,now(),0,300); noiseBurst(0.05,0.08,now(),8000); },
  splash(){ noiseBurst(0.3,0.12,now(),900); tone(200,0.2,"sine",0.12,now(),0,80); },
  deflate(){ tone(300,0.5,"sawtooth",0.14,now(),0,40); noiseBurst(0.4,0.06,now(),500); },
  oneup(){ for(let i=0;i<5;i++)tone(mf([72,76,79,84,88][i]),0.09,"triangle",0.2,now()+i*0.09); },
  stamp(){ noiseBurst(0.08,0.25,now(),2000); tone(90,0.12,"square",0.25,now()+0.02,0,60); },
};

const SONGS={

      bass:[48,0,55,0,48,0,55,0,45,0,52,0,45,0,52,0, 41,0,48,0,43,0,50,0,48,0,55,0,43,0,47,0]},
  w2:{bpm:126,lead:[69,0,0,72,74,0,72,0,69,0,72,0,67,0,0,0, 65,0,0,69,72,0,74,0,76,0,74,72,69,0,0,0],
      bass:[45,0,52,0,45,0,52,0,41,0,48,0,41,0,48,0, 38,0,45,0,38,0,45,0,40,0,47,0,43,0,45,0]},
  w3:{bpm:150,lead:[74,0,74,0,77,0,74,0,81,0,79,0,77,0,74,0, 72,0,74,77,74,0,72,0,70,0,72,74,72,0,70,0],
      bass:[38,0,50,0,38,0,50,0,36,0,48,0,36,0,48,0, 41,0,53,0,41,0,53,0,43,0,55,0,43,0,46,0]},
  w4:{bpm:132,lead:[67,0,71,0,74,0,71,0,76,0,74,0,71,0,67,0, 69,0,72,0,76,0,72,0,74,72,71,69,67,0,0,0],
      bass:[43,0,50,0,43,0,50,0,45,0,52,0,45,0,52,0, 41,0,48,0,41,0,48,0,38,0,45,0,43,0,43,0]},
  w5:{bpm:160,lead:[64,64,0,64,67,0,64,0,70,0,69,0,67,0,64,0, 64,64,0,64,67,0,70,0,72,0,70,69,67,0,0,0],
      bass:[40,0,40,47,40,0,40,47,38,0,38,45,38,0,38,45, 36,0,36,43,36,0,36,43,43,0,43,50,43,0,46,0]},
  w6:{bpm:118,lead:[70,0,0,74,0,0,77,0,79,0,77,74,70,0,0,0, 69,0,0,72,0,0,76,0,77,0,76,72,67,0,0,0],
      bass:[46,0,53,0,46,0,53,0,44,0,51,0,44,0,51,0, 45,0,52,0,45,0,52,0,43,0,50,0,43,0,50,0]},
  w7:{bpm:100,lead:[62,0,0,0,65,0,62,0,68,0,67,0,65,0,62,0, 61,0,0,0,65,0,68,0,70,0,68,67,65,0,67,0],
      bass:[38,0,38,0,38,0,38,0,36,0,36,0,36,0,36,0, 37,0,37,0,37,0,37,0,38,0,41,0,38,0,36,0]},
  boss:{bpm:168,lead:[62,0,62,63,62,0,60,0,62,0,65,0,63,62,60,0, 62,0,62,63,65,0,67,0,68,0,67,65,63,0,62,0],
        bass:[38,38,0,38,38,0,38,0,36,36,0,36,36,0,36,0, 34,34,0,34,34,0,34,0,41,0,39,0,38,0,36,0]},
  map:{bpm:120,lead:[76,0,0,0,74,0,72,0,74,0,76,0,79,0,0,0, 76,0,0,0,74,0,72,0,71,0,72,0,74,0,0,0],
       bass:[48,0,52,0,55,0,52,0,50,0,53,0,57,0,53,0, 48,0,52,0,55,0,52,0,43,0,47,0,50,0,47,0]},
};
function setSong(name){
  const s=SONGS[name]||null;
  if(AU.song!==s){AU.song=s;AU.step=0;if(AU.ctx)AU.nextT=AU.ctx.currentTime+0.05;}
}
function musicTick(){
  if(!AU.ctx||!AU.song||AU.muted)return;
  const spb=60/AU.song.bpm/2; // eighth note
  while(AU.nextT<AU.ctx.currentTime+0.18){
    const i=AU.step%32;
    const L=AU.song.lead[i],B=AU.song.bass[i];
    if(L)tone(mf(L),spb*0.9,"square",0.10,AU.nextT,AU.musGain);
    if(B)tone(mf(B),spb*0.95,"triangle",0.16,AU.nextT,AU.musGain);
    if(i%4===0)noiseBurst(0.03,0.035,AU.nextT,6000);
    AU.step++; AU.nextT+=spb;
  }
}

//================================================================ level DSL
function mkGrid(w,h){const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill(" "));return g;}
function bld(w,h){
  const g=mkGrid(w,h);
  const S={g,w,h,signs:[],
    put(x,y,c){if(x>=0&&x<w&&y>=0&&y<h)g[y][x]=c;return S;},
    row(x,y,n,c){for(let i=0;i<n;i++)S.put(x+i,y,c);return S;},
    col(x,y,n,c){for(let i=0;i<n;i++)S.put(x,y+i,c);return S;},
    box(x,y,bw,bh,c){for(let j=0;j<bh;j++)S.row(x,y+j,bw,c);return S;},
    gnd(x0,x1,top){for(let x=x0;x<=x1;x++)for(let y=top;y<h;y++)g[y][x]="#";return S;},
    sign(x,y,t){S.signs.push({x:x*TS,y:y*TS,t});return S;},
    // a parked rig: solid body + one-way roof, door gap
    rig(x,y,bw,bh){S.box(x,y,bw,bh,"B");S.row(x,y-1,bw,"=");return S;},
  };
  return S;
}

addLevel({world:1,label:"1-3",name:"DUMP STATION DRIVE",time:300,build(){

const MAP_NODES=[
  {x:70,y:200},{x:130,y:170},{x:190,y:200},{x:250,y:170},{x:310,y:200}, // W1 x5
  {x:370,y:165},{x:420,y:120},{x:380,y:70},{x:310,y:55},{x:240,y:75},{x:150,y:60}, // 2-1..7-B

</script>
<script>
"use strict";
//================================================================ state
const G={
  mode:"title", // title|map|play|pause|tally|gameover|win|dead
  levelIdx:0, unlocked:1, lives:3, score:0, hiScore:0, rods:0,
  tier:1, shieldEB:false, impactT:0, greaseT:0, surgeT:0, power:0, // power = amps meter 0..100
  combo:0, comboT:0, glitchT:0,
  timer:0, tipIdx:0, tipT:0, frame:0, msg:"", msgT:0,
  soDone:LEVELS.map(()=>[false,false,false]), roClosed:LEVELS.map(()=>false),
  cleared:LEVELS.map(()=>false),
  mapSel:0, tallyData:null, deathT:0, winT:0, shakeT:0,
  valve:null, // dump-station overlay state
};
let cur=null; // current level runtime
const SOLID="#XB?!%1U_WH", ONEWAY="=*I";
function isSolid(c){return SOLID.indexOf(c)>=0;}
function isOneWay(c){return ONEWAY.indexOf(c)>=0;}
function tileAt(tx,ty){
  if(!cur)return " ";
  if(tx<0||tx>=cur.w)return "#";
  if(ty<0)return " "; if(ty>=cur.h)return " ";
  return cur.grid[ty][tx];
}
function setTile(tx,ty,c){if(tx>=0&&tx<cur.w&&ty>=0&&ty<cur.h)cur.grid[ty][tx]=c;}
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

//================================================================ pools
const particles=[]; for(let i=0;i<160;i++)particles.push({on:false});
function spawnP(x,y,vx,vy,life,color,size){
  for(const p of particles)if(!p.on){Object.assign(p,{on:true,x,y,vx,vy,life,t:life,color,size:size||2});return;}
}
function burst(x,y,n,color,spd){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(0.5+Math.random())*(spd||2);spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s-1,30+Math.random()*20,color,1+Math.random()*2);}}
const shots=[]; for(let i=0;i<24;i++)shots.push({on:false});
function fireShot(o){for(const s of shots)if(!s.on){Object.assign(s,{on:true,life:600},o);return s;}return null;}

//================================================================ player
const P={x:0,y:0,w:10,h:14,vx:0,vy:0,face:1,onGround:false,crouch:false,slide:0,
  coyote:0,jbuf:0,jumpHeld:false,invT:0,attackT:0,climb:false,glide:0,gliding:false,
  carrier:null,skid:0,anim:0,dropT:0};
function playerH(){return G.tier>1?(P.crouch||P.slide>0?12:20):(P.crouch?10:14);}
function setMsg(t,f){G.msg=t;G.msgT=f||150;}

function loadLevel(idx,fromCheckpoint){
  const def=LEVELS[idx];
  const b=def.build();
  cur={def,grid:b.g,w:b.w,h:b.h,signs:b.signs,ents:[],boss:null,windy:!!def.windy,
    world:WORLDS[def.world],spawn:{x:2*TS,y:0},exitX:0,bumps:[],gustT:0,doorV:null};
  // parse entity chars out of the grid
  const EC="odsMFNeiGC5QTJRKDygbrPZtuwlh";
  for(let y=0;y<cur.h;y++)for(let x=0;x<cur.w;x++){
    const c=cur.grid[y][x];
    if(EC.indexOf(c)<0)continue;
    cur.grid[y][x]=" ";
    spawnEnt(c,x*TS,y*TS);
  }
  // find floor for spawn
  for(let y=0;y<cur.h;y++){if(isSolid(tileAt(2,y))){cur.spawn.y=y*TS-24;break;}}
  if(fromCheckpoint&&G.checkpoint&&G.checkpoint.idx===idx){P.x=G.checkpoint.x;P.y=G.checkpoint.y;}
  else{P.x=cur.spawn.x;P.y=cur.spawn.y;if(!fromCheckpoint)G.checkpoint=null;}
  Object.assign(P,{vx:0,vy:0,face:1,onGround:false,crouch:false,slide:0,coyote:0,jbuf:0,invT:90,attackT:0,climb:false,glide:0,gliding:false,carrier:null});
  for(const s of shots)s.on=false; for(const p of particles)p.on=false;
  G.timer=def.time; G.combo=0;G.comboT=0; G.surgeT=0;
  cam.x=Math.max(0,P.x-VW/2); cam.y=Math.max(0,cur.h*TS-VH);
  if(def.boss)initBoss(def.boss);
  setSong(def.song||cur.world.song);
}

function hurtPlayer(kind){
  if(G.surgeT>0||P.invT>0||G.mode!=="play")return;
  if(kind==="water"&&G.shieldEB){G.shieldEB=false;setMsg("ETERNABOND HELD!");burst(P.x+5,P.y+8,10,"#fff",2);SFX.clank();return;}
  if(G.tier>1){G.tier--;P.invT=110;SFX.hurt();burst(P.x+5,P.y+8,12,"#ffd24a",2);
    setMsg(G.tier===2?"LOST 50-AMP SERVICE!":"DOWN TO FLAT RATE!");}
  else killPlayer();
}
function killPlayer(){
  if(G.mode!=="play")return;
  G.mode="dead";G.deathT=0;P.vy=-6;SFX.die();setSong(null);
}
function addScore(n){G.score+=n*(1+G.combo);}
function bumpCombo(){G.combo=Math.min(3,G.combo+1);G.comboT=240;}

function collectEnt(e){
  switch(e.type){
    case "rod": G.rods++;addScore(10);SFX.ding();spawnP(e.x+4,e.y,0,-1,20,"#cfd8dc",2);
      if(G.rods>=100){G.rods-=100;G.lives++;SFX.oneup();setMsg("100 RODS = 1-UP!");} break;
    case "sealgoo": G.rods+=10;addScore(100);SFX.big();setMsg("SEALGOO SELF-LEVELING! +10");break;
    case "so": {const i=e.soIdx;G.soDone[G.levelIdx][i]=true;addScore(1000);SFX.big();
      setMsg("SERVICE ORDER "+(i+1)+"/3!");}break;
    case "wrench": if(G.tier<2){G.tier=2;setMsg("MASTER CERTIFIED!");}else addScore(500);SFX.power();break;
    case "dogbone": if(G.tier<3){G.tier=3;G.power=100;setMsg("50-AMP SERVICE! (X TO ARC)");}else {G.power=100;addScore(500);}SFX.power();break;
    case "surge": G.surgeT=600;SFX.power();setMsg("EMS PROTECTED!");break;
    case "eb": G.shieldEB=true;SFX.power();setMsg("ETERNABOND SHIELD (1 LEAK HIT)");break;
    case "impact": G.impactT=1200;SFX.power();setMsg("IMPACT DRIVER! 2X WRENCH");break;
    case "grease": G.greaseT=99999;SFX.power();setMsg("BEARING GREASE: RUN+DOWN = SLIDE");break;
    case "oneup": G.lives++;SFX.oneup();setMsg("PDI PASSED! 1-UP");addScore(1000);break;
  }
  e.dead=true;
}

function hatchBump(tx,ty,c){
  setTile(tx,ty,"U"); SFX.clank();
  cur.bumps.push({tx,ty,t:12});
  const x=tx*TS,y=(ty-1)*TS;
  if(c==="?"){spawnEnt("o",x,y).vy=-2;}
  else if(c==="!"){spawnEnt(G.tier<2?"M":"F",x,y).vy=-1;}
  else if(c==="1"){spawnEnt("1up",x,y).vy=-2;}
  else if(c==="%"){for(let i=0;i<3;i++){const m=spawnEnt("mouse",x,y);m.vx=(i-1)*0.8;m.vy=-2;}SFX.pop();setMsg("MICE! PROTECT THE WIRING!");}
}

function tryWrenchTile(){
  // wrench interactions with tiles in front: cap vents ('y' entities handle themselves), open window W
  const tx=Math.floor((P.x+P.w/2+P.face*12)/TS);
  for(let dy=-1;dy<=1;dy++){
    const ty=Math.floor((P.y+playerH()/2)/TS)+dy;
    if(tileAt(tx,ty)==="W"){setTile(tx,ty,"w_open");SFX.clank();setMsg("WINDOW OPEN - VENTING LP!");
      for(const e of cur.ents)if(e.type==="propane"&&Math.abs(e.x-tx*TS)<160){e.venting=true;}
      burst(tx*TS+8,ty*TS+8,8,"#bfe9ff",1.5);return;}
  }
}

function updatePlayer(){
  const slickOn = tileAt(Math.floor((P.x+P.w/2)/TS),Math.floor((P.y+playerH()+1)/TS))==="_";
  // feet-anchored crouch with a headroom check before standing back up
  const wantCrouch=keys.d&&P.onGround&&P.slide<=0;
  if(wantCrouch&&!P.crouch){const feet=P.y+playerH();P.crouch=true;P.y=feet-playerH();}
  else if(!wantCrouch&&P.crouch){
    const feet=P.y+playerH(), sh=G.tier>1?20:14, ny=feet-sh;
    let blocked=false;
    for(let ty=Math.floor(ny/TS);ty<=Math.floor((feet-1)/TS);ty++)
      for(let tx=Math.floor(P.x/TS);tx<=Math.floor((P.x+P.w)/TS);tx++)
        if(isSolid(tileAt(tx,ty)))blocked=true;
    if(!blocked){P.crouch=false;P.y=ny;}
  }
  // start grease slide
  if(G.greaseT>0&&keys.d&&P.onGround&&Math.abs(P.vx)>1.8&&P.slide<=0){
    P.slide=26;SFX.clank();spawnP(P.x,P.y+playerH(),0,0,40,"#8d6e63",3);
  }
  if(P.slide>0){P.slide--;P.vx=P.face*2.9; if(P.slide%4===0)spawnP(P.x+5,P.y+playerH()-2,-P.face,0,25,"#a1887f",2);}
  // horizontal accel
  const max=keys.run?2.6:1.5, acc=P.onGround?(slickOn?0.05:0.11):0.09, fric=slickOn?0.99:(P.onGround?0.85:0.98);
  let move=0; if(keys.l)move=-1; if(keys.r)move=1;
  if(P.slide<=0&&!(P.crouch&&P.onGround&&move===0)){
    if(move!==0){
      if(P.onGround&&move*P.vx<0&&Math.abs(P.vx)>1.6){P.vx+=move*0.22;P.skid=8;} // skid turnaround
      else P.vx+=move*acc;
      if(!P.crouch)P.face=move;
      if(Math.abs(P.vx)>max)P.vx=max*Math.sign(P.vx);
    } else P.vx*=fric;
  } else if(P.slide<=0) P.vx*=fric;
  if(Math.abs(P.vx)<0.05&&move===0)P.vx=0;
  if(P.skid>0)P.skid--;

  // ladders
  const cx=Math.floor((P.x+P.w/2)/TS), cyT=Math.floor((P.y+4)/TS), cyB=Math.floor((P.y+playerH()-2)/TS);
  const onLadder=tileAt(cx,cyT)==="L"||tileAt(cx,cyB)==="L";
  if(onLadder&&(keys.u||(P.climb&&keys.d))){P.climb=true;}
  if(!onLadder)P.climb=false;
  if(P.climb){
    P.vy=(keys.u?-1.4:keys.d?1.4:0); P.vx*=0.7;
    if(kEdge.jump){P.climb=false;P.vy=-4.5;SFX.jump();}
  } else {
    // jumping
    if(kEdge.jump)P.jbuf=7;else if(P.jbuf>0)P.jbuf--;
    if(P.onGround)P.coyote=6;else if(P.coyote>0)P.coyote--;
    if(P.jbuf>0&&P.coyote>0){
      P.vy=-7.0;P.onGround=false;P.coyote=0;P.jbuf=0;P.jumpHeld=true;P.carrier=null;SFX.jump();
    }
    if(!keys.jump&&P.jumpHeld){if(P.vy<-2.6)P.vy=-2.6;P.jumpHeld=false;}
    // awning glide: has charge, falling, holding jump
    P.gliding=false;
    if(P.glide>0&&!P.onGround&&P.vy>0&&keys.jump){
      P.vy=Math.min(P.vy,0.9);P.gliding=true;
      if(cur.windy&&cur.gustT>0){P.vx+=cur.gustW*0.12;
        if(Math.random()<0.01){P.glide=0;setMsg("GUST TORE THE AWNING!");SFX.pop();burst(P.x+5,P.y,8,"#eceff1",2);}}
    }
    P.vy+=0.34; if(P.vy>5.5)P.vy=5.5;
    if(P.gliding&&P.vy>0.9)P.vy=0.9;
  }
  // attack
  if(P.attackT>0)P.attackT--;
  if(kEdge.act&&P.attackT<=0&&P.slide<=0){
    P.attackT=G.impactT>0?7:13;SFX.clank();tryWrenchTile();
    if(G.tier===3&&!P.crouch){ // 50-amp service: the swing also throws an arc
      if(G.power>=10){G.power-=10;SFX.arc();
        fireShot({x:P.x+P.w/2+P.face*6,y:P.y+6,vx:P.face*3.4,vy:-2.2,type:"arc",hostile:false});}
      else setMsg("POWER LOW - FIND A PEDESTAL");
    }
  }
  // integrate + collide
  moveEntity(P,playerH(),true);
  // carrier drag
  if(P.carrier&&P.onGround){P.x+=P.carrier.dx||0;P.y+=P.carrier.dy||0;}
  // tile interactions at feet/body
  const ph=playerH();
  const foots=[[P.x+1,P.y+ph+1],[P.x+P.w-1,P.y+ph+1]];
  // hazards overlap
  for(let ty=Math.floor(P.y/TS);ty<=Math.floor((P.y+ph)/TS);ty++)
    for(let tx=Math.floor(P.x/TS);tx<=Math.floor((P.x+P.w)/TS);tx++){
      const c=tileAt(tx,ty);
      if(c==="^")hurtPlayer("spike");
      else if(c==="~")hurtPlayer("water");
      else if(c==="A"&&P.glide<1){P.glide=1;setMsg("AWNING GRABBED - HOLD JUMP TO GLIDE");}
      else if(c==="E"){levelClear();return;}
      else if(c==="V"&&kEdge.d&&P.onGround&&!cur.valveUsed){openValveRoom();}
      else if(c==="I"){ // brittle frozen plank: crumble shortly after stepped on
        if(ty===Math.floor((P.y+ph+1)/TS)&&!cur.bumps.some(b=>b.tx===tx&&b.ty===ty))
          cur.bumps.push({tx,ty,t:20,ice:true});
      }
    }
  // fell out of world
  if(P.y>cur.h*TS+40)killPlayer();
  if(P.invT>0)P.invT--;
  if(G.surgeT>0)G.surgeT--;
  if(G.impactT>0)G.impactT--;
  // 50A power regen (faster near an active pedestal)
  if(G.tier===3){
    let near=false;
    for(const e of cur.ents)if((e.type==="ped30"||e.type==="ped50")&&e.lit&&Math.abs(e.x-P.x)<40){near=e.type==="ped50"?2:1;}
    G.power=Math.min(100,G.power+(near===2?0.5:near===1?0.18:0.03));
  }
  P.anim+=Math.abs(P.vx)*0.15+0.02;
}

// axis-separated tile collision for any entity ({x,y,w,vx,vy}); h passed in
function moveEntity(e,h,isPlayer){
  // X
  e.x+=e.vx;
  let x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w)/TS),y0=Math.floor(e.y/TS),y1=Math.floor((e.y+h-1)/TS);
  for(let ty=y0;ty<=y1;ty++){
    if(e.vx>0&&isSolid(tileAt(x1,ty))){e.x=x1*TS-e.w-0.01;e.vx=isPlayer?0:-e.vx;if(isPlayer&&P.slide>0)P.slide=0;e.hitWall=true;}
    else if(e.vx<0&&isSolid(tileAt(x0,ty))){e.x=(x0+1)*TS+0.01;e.vx=isPlayer?0:-e.vx;e.hitWall=true;}
    x0=Math.floor(e.x/TS);x1=Math.floor((e.x+e.w)/TS);
  }
  // hatch bump from below then Y collision
  const wasVy=e.vy;
  e.y+=e.vy;
  if(isPlayer)P.onGround=false; else e.onGround=false;
  x0=Math.floor(e.x/TS);x1=Math.floor((e.x+e.w)/TS);
  y0=Math.floor(e.y/TS);y1=Math.floor((e.y+h)/TS);
  if(e.vy<0){
    for(let tx=x0;tx<=x1;tx++){
      const c=tileAt(tx,y0);
      if(isSolid(c)){
        e.y=(y0+1)*TS+0.01;e.vy=0;
        if(isPlayer&&"?!%1".indexOf(c)>=0)hatchBump(tx,y0,c);
        break;
      }
    }
  } else {
    for(let tx=x0;tx<=x1;tx++){
      const c=tileAt(tx,y1);
      const prevBottom=e.y-wasVy+h;
      if(isSolid(c)||(isOneWay(c)&&prevBottom<=y1*TS+2)){
        e.y=y1*TS-h-0.01;e.vy=0;
        if(isPlayer){P.onGround=true;P.carrier=null;}else e.onGround=true;
        break;
      }
    }
  }
  // moving platforms (player only): land on top
  if(isPlayer){
    for(const pl of cur.ents){
      if(!pl.plat||pl.dead)continue;
      const pb={x:pl.x,y:pl.y,w:pl.w,h:6};
      if(P.vy>=0&&P.x+P.w>pl.x&&P.x<pl.x+pl.w){
        const prevBottom=P.y-wasVy+h;
        if(prevBottom<=pl.y+3&&P.y+h>=pl.y&&P.y+h<=pl.y+10){
          P.y=pl.y-h-0.01;P.vy=0;P.onGround=true;P.carrier=pl;
        }
      }
    }
  }
}

//================================================================ dump valve room
function openValveRoom(){
  G.valve={pulled:[],done:false,t:0,result:null};
  G.mode="valve";SFX.plug();
}
function updateValve(){
  const v=G.valve; v.t++;
  if(v.result){ if(v.t>140){G.mode="play"; if(v.result==="win"){} } return;}
  if(kEdge.l&&!v.pulled.includes("BLACK"))pull("BLACK");
  else if(kEdge.r&&!v.pulled.includes("GRAY"))pull("GRAY");
  function pull(which){
    v.pulled.push(which);SFX.grind();
    if(v.pulled[0]==="GRAY"){v.result="lose";v.t=0;cur.valveUsed=true;SFX.splash();setMsg("GRAY FIRST?! NO RINSE FOR YOU.");}
    else if(v.pulled.length===2){v.result="win";v.t=0;cur.valveUsed=true;SFX.big();
      addScore(500);G.rods+=25;setMsg("BLACK THEN GRAY - TEXTBOOK! +25 RODS");}
  }
  if((kEdge.pause||kEdge.jump)&&!v.result)G.mode="play";
}
</script>
<script>
"use strict";
//================================================================ entities
let soCounter=0;
function spawnEnt(c,x,y){
  const e={x,y,vx:0,vy:0,w:12,h:12,dead:false,t:0,type:"?",enemy:false,plat:false,dx:0,dy:0};
  switch(c){
    case "o": Object.assign(e,{type:"rod",w:8,h:12,pickup:true});break;
    case "d": Object.assign(e,{type:"sealgoo",w:12,h:8,pickup:true});break;
    case "s": Object.assign(e,{type:"so",w:12,h:14,pickup:true,soIdx:(soCounter++)%3});break;
    case "M": Object.assign(e,{type:"wrench",w:14,h:10,pickup:true});break;
    case "F": Object.assign(e,{type:"dogbone",w:14,h:10,pickup:true});break;
    case "N": Object.assign(e,{type:"surge",w:12,h:12,pickup:true});break;
    case "e": Object.assign(e,{type:"eb",w:12,h:10,pickup:true});break;
    case "i": Object.assign(e,{type:"impact",w:12,h:12,pickup:true});break;
    case "G": Object.assign(e,{type:"grease",w:12,h:10,pickup:true});break;
    case "1up": Object.assign(e,{type:"oneup",w:12,h:12,pickup:true});break;
    case "C": Object.assign(e,{type:"ped30",w:12,h:24,y:y-8,lit:false});break;
    case "5": Object.assign(e,{type:"ped50",w:12,h:24,y:y-8,lit:false});break;
    case "Q": Object.assign(e,{type:"spring",w:16,h:10,y:y+6});break;
    case "T": Object.assign(e,{type:"seesaw",w:48,h:6,plat:true,y0:y,x:x-16});break;
    case "J": Object.assign(e,{type:"jack",w:32,h:8,plat:true,y0:y,phase:Math.random()*6.28});break;
    case "R": Object.assign(e,{type:"ramp",w:0,h:6,plat:true,pivX:x,cyc:Math.floor(Math.random()*450)});break;
    case "K": Object.assign(e,{type:"crusher",w:36,h:22,plat:true,x0:x,cyc:Math.random()*300,parked:false,enemy:true});break;
    case "D": Object.assign(e,{type:"drag",w:48,h:8,plat:true,traveled:0});break;
    case "y": Object.assign(e,{type:"vent",w:16,h:8,capped:false,cd:60,kids:0});break;
    case "g": Object.assign(e,{type:"goblin",w:12,h:12,y:y+4,enemy:true,vx:-0.5,dmg:"water"});break;
    case "b": Object.assign(e,{type:"blob",w:14,h:12,y:y+4,enemy:true,vx:-0.4,big:false,dmg:"water"});break;
    case "r": Object.assign(e,{type:"screamer",w:14,h:14,y:y+2,enemy:true,vx:-1.7});break;
    case "P": Object.assign(e,{type:"pedbad",w:14,h:26,y:y-10,enemy:true});break;
    case "Z": Object.assign(e,{type:"serpent",w:14,h:44,y:y-28,enemy:true,segs:3,riseT:0,dmg:"water"});break;
    case "t": Object.assign(e,{type:"betty",w:14,h:14,y:y+2,enemy:true,vx:-0.4,inflate:0});break;
    case "u": Object.assign(e,{type:"upseller",w:12,h:20,y:y-4,enemy:true,vx:-0.6,cd:120});break;
    case "w": Object.assign(e,{type:"wraith",w:14,h:16,enemy:true,frzT:120});break;
    case "l": Object.assign(e,{type:"propane",w:44,h:18,enemy:true,venting:false});break;
    case "h": Object.assign(e,{type:"bike",w:18,h:12,y:y+4,enemy:true,vx:-2.2});break;
    case "mouse": Object.assign(e,{type:"mouse",w:9,h:7,enemy:true,vx:1,chew:0});break;
    default: e.dead=true;
  }
  cur.ents.push(e);return e;
}
function dieEnemy(e,pts,quiet){
  e.dead=true;addScore(pts||100);bumpCombo();
  if(!quiet)SFX.stomp();
  burst(e.x+e.w/2,e.y+e.h/2,10,"#eceff1",2);
}
function stompBounce(){P.vy=keys.jump?-6.5:-4.2;P.onGround=false;}
function playerRect(){return{x:P.x,y:P.y,w:P.w,h:playerH()};}
function wrenchRect(){
  if(P.attackT<=(G.impactT>0?3:5))return null;
  return {x:P.x+(P.face>0?P.w:-16),y:P.y+2,w:16,h:playerH()};
}
function touchDamage(e){
  if(G.surgeT>0){
    if(e.type!=="propane"&&e.type!=="crusher"){dieEnemy(e,200);SFX.arc();return;}
  }
  hurtPlayer(e.dmg||"hit");
}
// generic walker physics for grounded enemies
function walk(e,grav){
  e.hitWall=false; e.vy+=(grav===undefined?0.3:grav); if(e.vy>5)e.vy=5;
  moveEntity(e,e.h,false);
}

function updateEnts(){
  const pr=playerRect(), wr=wrenchRect();
  for(const e of cur.ents){
    if(e.dead)continue;
    e.t++; e.dx=0;e.dy=0;
    const px=P.x+P.w/2;
    switch(e.type){
      //---------------- pickups
      case "rod": case "sealgoo": case "so": case "wrench": case "dogbone":
      case "surge": case "eb": case "impact": case "grease": case "oneup":
        if(e.vy!==0||!e.settled){e.vy+=0.3;moveEntity(e,e.h,false);if(e.onGround){e.vy=0;e.settled=true;}}
        if(rectsOverlap(pr,e))collectEnt(e);
        break;
      //---------------- checkpoints
      case "ped30": case "ped50":
        if(!e.lit&&rectsOverlap(pr,e)){
          e.lit=true;SFX.plug();G.checkpoint={idx:G.levelIdx,x:e.x,y:e.y-4};
          setMsg(e.type==="ped50"?"50A SHORE POWER - CHECKPOINT!":"30A SHORE POWER - CHECKPOINT!");
          addScore(200);
        }
        break;
      //---------------- gimmicks
      case "spring":
        if(P.vy>0&&rectsOverlap(pr,{x:e.x,y:e.y-4,w:e.w,h:10})){
          P.vy=-10;P.onGround=false;P.glide=Math.max(P.glide,0);SFX.jump();
          burst(e.x+8,e.y,6,"#90caf9",2);
        }
        break;
      case "seesaw": {
        const on=P.carrier===e;
        const target=on?e.y0+10:e.y0;
        const ny=e.y+((target-e.y)*0.15);
        e.dy=ny-e.y; e.y=ny;
        if(!on&&e.dy<-0.5&&Math.abs(px-(e.x+e.w/2))<40&&P.y+playerH()<=e.y+8&&P.vy>=0){/* flick assist */}
        break;}
      case "jack": {
        const spd=(P.carrier===e&&keys.act)?(G.impactT>0?4:2.5):1.2;
        e.phase+=spd*0.02;
        const ny=e.y0-32-Math.sin(e.phase)*32;
        e.dy=ny-e.y;e.y=ny;
        break;}
      case "ramp": {
        e.cyc=(e.cyc+1)%450;
        const down=e.cyc<300, rising=e.cyc>=300&&e.cyc<330;
        if(e.cyc===0){SFX.grind();}
        if(e.cyc===300)SFX.hiss();
        e.x=e.pivX; e.w=down?128:0;
        if(rising&&P.carrier===e){P.vy=-3;} // shrugged off
        break;}
      case "crusher": {
        if(!e.parked){
          e.cyc=(e.cyc+1)%300;
          const ph=e.cyc/300;
          let ext=ph<0.35?ph/0.35:(ph<0.5?1:(ph<0.85?1-(ph-0.5)/0.35:0));
          const nx=e.x0 - ext*40; // extends leftward
          e.dx=nx-e.x; e.x=nx;
          if(e.cyc===1)SFX.grind();
          // crush check: overlap while moving
          if(Math.abs(e.dx)>0.05&&rectsOverlap(pr,e))hurtPlayer("crush");
          // stomp motor housing on top parks it
          if(P.vy>0&&rectsOverlap({x:P.x,y:P.y+playerH(),w:P.w,h:4},{x:e.x+4,y:e.y-4,w:e.w-8,h:6})){
            e.parked=true;stompBounce();SFX.stomp();addScore(400);setMsg("SLIDE-OUT PARKED!");burst(e.x+18,e.y,10,"#ffd24a",2);
          }
        }
        break;}
      case "drag": {
        if(P.carrier===e&&e.traveled<224){e.dx=1.2;e.x+=1.2;e.traveled+=1.2;
          if(e.t%20===0)spawnP(e.x,e.y+4,-1,0,20,"#9e9e9e",2);}
        break;}
      case "vent": {
        if(!e.capped){
          if(e.t%8===0)spawnP(e.x+8,e.y+4,(Math.random()-0.5),0.7,25,"#64b5f6",2);
          e.cd--;
          if(e.cd<=0&&e.kids<2){e.cd=240;e.kids++;
            const g=spawnEnt("goblin",e.x+2,e.y+8);g.vent=e;g.vy=1;}
          if(wr&&rectsOverlap(wr,{x:e.x,y:e.y-4,w:e.w,h:16})){
            e.capped=true;SFX.big();addScore(300);setMsg("PENETRATION SEALED!");
            burst(e.x+8,e.y+4,8,"#f5f5f5",1.5);
          }
        }
        break;}
      //---------------- enemies
      case "goblin":
        walk(e);
        if(wr&&rectsOverlap(wr,e)){if(e.vent)e.vent.kids--;dieEnemy(e,100);}
        else if(rectsOverlap(pr,e)){
          if(P.vy>0&&P.y+playerH()<e.y+e.h*0.6){if(e.vent)e.vent.kids--;dieEnemy(e,100);stompBounce();}
          else touchDamage(e);
        }
        break;
      case "blob":
        if(e.onGround&&e.t%50===0){e.vy=-3;e.vx=(px<e.x?-0.7:0.7);}
        walk(e);
        // water makes delam worse
        if(!e.big)for(const o of cur.ents)if(!o.dead&&o.type==="goblin"&&rectsOverlap(e,o)){
          e.big=true;e.w=20;e.h=18;o.dead=true;burst(e.x,e.y,8,"#64b5f6",2);}
        if(wr&&rectsOverlap(wr,e))dieEnemy(e,150);
        else if(rectsOverlap(pr,e)){
          if(P.vy>0&&P.y+playerH()<e.y+e.h*0.6){
            if(e.big){e.big=false;e.w=14;e.h=12;stompBounce();SFX.stomp();}
            else {dieEnemy(e,150);stompBounce();}
          } else touchDamage(e);
        }
        break;
      case "screamer":
        walk(e);
        if(e.t%3===0)spawnP(e.x+e.w/2,e.y+2,(Math.random()-0.5),-1,30,"#9e9e9e",2);
        if(e.t%5===0)spawnP(e.x+e.w/2,e.y+4,(Math.random()-0.5)*0.5,-0.7,15,"#ff9800",2);
        if(e.t%90===0)tone(1400+Math.random()*400,0.15,"sawtooth",0.03,now(),0,600);
        if(rectsOverlap(pr,e)){
          if(P.slide>0){dieEnemy(e,300);setMsg("BEARING REPACKED. VIOLENTLY.");}
          else touchDamage(e);
        }
        break;
      case "pedbad":
        if(e.t%12===0)spawnP(e.x+7,e.y+8,(Math.random()-0.5)*2,-Math.random(),12,"#ffee58",1);
        if(rectsOverlap(pr,e)){
          if(G.surgeT>0){dieEnemy(e,400);SFX.arc();setMsg("GROUND FAULT: CLEARED!");}
          else hurtPlayer("shock");
        }
        break;
      case "serpent": {
        e.riseT++;
        const cycle=e.riseT%260, up=cycle<160;
        e.curH=up?Math.min(e.segs*14,e.curH===undefined?0:e.curH+1.2):Math.max(6,e.curH-1.2);
        const top=e.y+44-e.curH;
        const hb={x:e.x,y:top,w:14,h:e.curH};
        if(rectsOverlap(pr,hb)){
          if(P.vy>0&&P.y+playerH()<top+10){
            e.segs--;SFX.stomp();stompBounce();addScore(150);bumpCombo();
            burst(e.x+7,top,8,"#8bc34a",2);
            if(e.segs<=0){e.dead=true;SFX.deflate();addScore(300);setMsg("STINKY SLINKY: DEFLATED");}
            else e.curH=Math.max(6,e.curH-14);
          } else touchDamage(e);
        }
        if(wr&&rectsOverlap(wr,hb)){e.segs--;SFX.clank();if(e.segs<=0){e.dead=true;SFX.deflate();addScore(300);}}
        break;}
      case "betty":
        walk(e);
        if(Math.abs(px-e.x)<90)e.inflate++;
        if(e.inflate>0){const s=Math.min(1,e.inflate/240);e.w=14+s*14;e.h=14+s*14;
          if(e.inflate>=240){ // POP
            e.dead=true;SFX.pop();burst(e.x+e.w/2,e.y+e.h/2,16,"#424242",3);G.shakeT=10;
            for(let i=0;i<4;i++)fireShot({x:e.x+e.w/2,y:e.y+e.h/2,vx:(i<2?-1:1)*(1+i%2),vy:-2-(i%2),type:"shrap",hostile:true});
          }}
        if(rectsOverlap(pr,e)){
          if(P.vy>0&&P.y+playerH()<e.y+e.h*0.5&&e.inflate<120){dieEnemy(e,200);setMsg("CAUGHT IT COLD!");stompBounce();}
          else touchDamage(e);
        }
        if(wr&&rectsOverlap(wr,e)&&e.inflate<120)dieEnemy(e,200);
        break;
      case "upseller":
        walk(e);
        if(e.t%160===0&&Math.abs(px-e.x)<180){
          e.cd=0;SFX.clank();
          fireShot({x:e.x+6,y:e.y+4,vx:(px<e.x?-1.8:1.8),vy:-1,type:"paper",hostile:true});
        }
        if(wr&&rectsOverlap(wr,e))
          {dieEnemy(e,300);setMsg('"...I\'LL HAVE TO CHECK WITH MY MANAGER."');}
        else if(rectsOverlap(pr,e)){
          if(P.vy>0&&P.y+playerH()<e.y+e.h*0.5){dieEnemy(e,300);stompBounce();setMsg('"...I\'LL HAVE TO CHECK WITH MY MANAGER."');}
          else touchDamage(e);
        }
        break;
      case "wraith": {
        const dx=px-(e.x+7),dy=(P.y+8)-(e.y+8);
        const d=Math.hypot(dx,dy)||1;
        e.x+=dx/d*0.45; e.y+=dy/d*0.45+Math.sin(e.t*0.05)*0.3;
        e.frzT--;
        if(e.frzT<=0){e.frzT=150; // freeze nearby one-way platforms brittle
          const tx=Math.floor(e.x/TS),ty=Math.floor(e.y/TS);
          for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++)
            if(tileAt(tx+i,ty+j)==="=")setTile(tx+i,ty+j,"I");
          SFX.hiss();
        }
        // melts near a water heater tile
        {const tx=Math.floor((e.x+7)/TS),ty=Math.floor((e.y+8)/TS);
         let melt=false;
         for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++)if(tileAt(tx+i,ty+j)==="H")melt=true;
         if(melt){dieEnemy(e,500,true);SFX.splash();setMsg("BYPASS VALVE OPEN - WRAITH THAWED!");}}
        if(rectsOverlap(pr,e))touchDamage(e);
        break;}
      case "propane":
        if(e.venting){e.w-=0.3;e.h-=0.2;if(e.w<6){e.dead=true;setMsg("LP VENTED. NICE DISCIPLINE.");addScore(400);}break;}
        e.x+=Math.sin(e.t*0.02)*0.3;
        if(e.t%80===0)SFX.hiss();
        if(rectsOverlap(pr,e))hurtPlayer("gas");
        break;
      case "bike":
        walk(e);
        if(e.t%6===0)spawnP(e.x+(e.vx>0?0:e.w),e.y+e.h-2,-Math.sign(e.vx),-0.5,15,"#a1887f",2);
        if(rectsOverlap(pr,e)){
          if(P.vy>0&&P.y+playerH()<e.y+e.h*0.5){dieEnemy(e,200);setMsg("KICKSTAND DEPLOYED.");stompBounce();}
          else touchDamage(e);
        }
        break;
      case "mouse": {
        walk(e);
        if(e.hitWall)e.vx*=1; // moveEntity flipped already
        const tx=Math.floor((e.x+4)/TS),ty=Math.floor((e.y+e.h+1)/TS);
        if(tileAt(tx,ty)==="*"){e.chew++;
          if(e.chew%50===49){setTile(tx,ty," ");burst(tx*TS+8,ty*TS+4,6,"#ffb74d",2);SFX.clank();}}
        if(wr&&rectsOverlap(wr,e))dieEnemy(e,80);
        else if(rectsOverlap(pr,e)){
          if(P.vy>0)dieEnemy(e,80),stompBounce();
          else touchDamage(e);
        }
        break;}
    }
    // generic wrench-kill fallback for goblin handled above per-type
  }
  cur.ents=cur.ents.filter(e=>!e.dead);
  // sync serpent kid counters safely (vents)
}

//================================================================ shots
function updateShots(){
  const pr=playerRect(), wr=wrenchRect();
  for(const s of shots){
    if(!s.on)continue;
    s.life--;
    if(s.type==="arc"){
      s.vy+=0.25;s.x+=s.vx;s.y+=s.vy;
      const tx=Math.floor(s.x/TS),ty=Math.floor(s.y/TS);
      if(isSolid(tileAt(tx,ty))){
        if(s.vy>0&&!isSolid(tileAt(tx,Math.floor((s.y-s.vy)/TS)))){s.y=ty*TS-1;s.vy=-3;}
        else s.on=false;
      }
      if(s.on&&Math.random()<0.5)spawnP(s.x,s.y,0,0,8,"#ffee58",1);
      for(const e of cur.ents){
        if(e.dead||!e.enemy)continue;
        if(rectsOverlap({x:s.x-3,y:s.y-3,w:6,h:6},e)){
          if(e.type==="propane"){ // BOOM — teaches weapon discipline
            s.on=false;e.dead=true;SFX.pop();G.shakeT=16;
            burst(e.x+e.w/2,e.y+e.h/2,24,"#ff7043",4);
            if(Math.hypot(px2(e)-(P.x+5),(e.y+e.h/2)-(P.y+8))<70)hurtPlayer("blast");
            for(const o of cur.ents)if(!o.dead&&o.enemy&&o!==e&&Math.hypot(px2(e)-px2(o),(e.y-o.y))<70)dieEnemy(o,100,true);
            setMsg("NEVER ARC NEAR LP GAS!");
          } else if(e.type==="crusher"||e.type==="pedbad"){s.on=false;}
          else {s.on=false;dieEnemy(e,150,true);SFX.arc();}
        }
      }
      if(cur.boss&&cur.boss.kind==="lemon")lemonArcHit(s);
    } else { // hostile shots
      if(s.type==="spark"||s.type==="shrap"){s.vy+=0.22;}
      if(s.type==="acunit"){s.vy+=0.3;}
      s.x+=s.vx;s.y+=s.vy;
      if(s.type==="wave"||s.type==="sludge"){ // hug the ground
        const ty=Math.floor((s.y+8)/TS);
        if(!isSolid(tileAt(Math.floor(s.x/TS),ty)))s.vy+=0.3;else{s.y=ty*TS-8;s.vy=0;}
      }
      if(s.type==="paper"&&wr&&rectsOverlap(wr,{x:s.x-4,y:s.y-4,w:8,h:8})){
        s.hostile=false;s.vx*=-1.6;s.type="paperR";SFX.clank();
      }
      if(s.type==="paperR"){
        for(const e of cur.ents)if(!e.dead&&e.enemy&&rectsOverlap({x:s.x-4,y:s.y-4,w:8,h:8},e)){dieEnemy(e,300,false);s.on=false;}
        if(cur.boss&&cur.boss.kind)bossPaperHit(s);
      }
      if(s.hostile&&rectsOverlap({x:s.x-4,y:s.y-4,w:8,h:8},pr)){
        s.on=false;hurtPlayer(s.type==="sludge"?"water":"hit");
      }
      if(s.type!=="wave"&&s.type!=="sludge"&&s.type!=="acunit"&&s.type!=="paper"&&s.type!=="paperR"){
        if(isSolid(tileAt(Math.floor(s.x/TS),Math.floor(s.y/TS))))s.on=false;
      }
      if(s.type==="acunit"&&isSolid(tileAt(Math.floor(s.x/TS),Math.floor((s.y+6)/TS)))){
        s.on=false;burst(s.x,s.y,10,"#b0bec5",3);SFX.pop();
      }
    }
    if(s.life<=0||s.x<-40||s.x>cur.w*TS+40||s.y>cur.h*TS+60)s.on=false;
  }
}
function px2(e){return e.x+e.w/2;}

//================================================================ bosses
function initBoss(kind){
  if(kind==="sway"){
    cur.boss={kind,hp:3,x:cur.w*TS-140,y:11*TS,w:96,h:40,vx:0,state:"pause",t:0,dir:-1,intro:120};
  } else if(kind==="lemon"){
    cur.boss={kind,phase:1,hp:3,x:cur.w*TS-190,y:7*TS,w:160,h:128,t:0,atkT:0,panelT:0,
      vents:[false,false,false],switchUp:0,intro:160};
  }
}
function bossPaperHit(s){/* reflected paper vs bosses: minor chip on sway bar when paused */}

function updateBoss(){
  const b=cur.boss; if(!b||b.dead)return;
  b.t++;
  if(b.intro>0){b.intro--;
    if(b.kind==="sway"&&b.intro===60)setMsg("THE SWAY MONSTER! STOMP THE SWAY BAR!");
    if(b.kind==="lemon"&&b.intro===100)setMsg("THE LEMON AWAKENS...");
    if(b.kind==="lemon"&&b.intro===40)setMsg("PHASE 1: KILL THE 12V - STOMP THE DISCONNECT!");
    return;}
  const pr=playerRect();
  if(b.kind==="sway"){
    if(b.state==="pause"){
      b.vx=0;
      if(b.t%180<150){ b.vuln=true; } // sway-bar exposed while parked
      if(b.t%180===150){b.state="sweep";b.dir=(P.x<b.x?-1:1);b.vuln=false;SFX.grind();b.bobT=0;}
      // stomp the sway bar: small box at tongue (front-low, faces player side)
      const barX=b.dir<0?b.x-14:b.x+b.w+2;
      b.bar={x:b.x-14,y:b.y+b.h-10,w:14,h:10};
      if(b.vuln&&P.vy>0&&rectsOverlap({x:P.x,y:P.y+playerH(),w:P.w,h:5},b.bar)){
        b.hp--;stompBounce();SFX.stomp();G.shakeT=12;burst(b.bar.x+7,b.bar.y,12,"#ffd24a",3);
        setMsg(b.hp>0?"SWAY BAR TIGHTENED! ("+b.hp+" LEFT)":"FRICTION RESTORED!");
        if(b.hp<=0){bossDefeated();return;}
        b.state="sweep";b.dir=1;b.t=0;
      }
    } else {
      b.bobT=(b.bobT||0)+1;
      b.vx=b.dir*3.2; b.x+=b.vx;
      b.y=11*TS+Math.sin(b.bobT*0.25)*10; // fishtail wobble
      if(b.x<40){b.x=40;b.state="pause";b.t=0;}
      if(b.x>cur.w*TS-40-b.w){b.x=cur.w*TS-40-b.w;b.state="pause";b.t=0;}
      if(b.t%7===0)spawnP(b.x+Math.random()*b.w,b.y+b.h,0,-0.5,12,"#bcaaa4",2);
    }
    if(rectsOverlap(pr,b))hurtPlayer("hit");
  }
  else if(b.kind==="lemon"){
    b.atkT++;
    const roofY=b.y, roof={x:b.x,y:b.y-2,w:b.w,h:6};
    // rig roof is standable
    if(P.vy>=0&&P.x+P.w>b.x&&P.x<b.x+b.w){
      const prevBottom=P.y-P.vy+playerH();
      if(prevBottom<=roofY+3&&P.y+playerH()>=roofY&&P.y+playerH()<=roofY+10){
        P.y=roofY-playerH()-0.01;P.vy=0;P.onGround=true;P.carrier=null;
      }
    }
    // body contact (below roof) hurts in phase 1-2
    if(b.phase<3&&rectsOverlap(pr,{x:b.x+4,y:b.y+8,w:b.w-8,h:b.h-8}))hurtPlayer("hit");
    if(b.phase===1){
      if(b.atkT%110===0){SFX.arc();
        fireShot({x:b.x+20,y:b.y+40,vx:-(1.2+Math.random()*1.5),vy:-(4+Math.random()*2),type:"spark",hostile:true});}
      // disconnect switch pops up on the roof cyclically
      b.switchUp=(b.t%240<160)?1:0;
      if(b.switchUp){
        const sw={x:b.x+24,y:roofY-12,w:16,h:12};
        b.sw=sw;
        if(P.vy>0&&rectsOverlap({x:P.x,y:P.y+playerH(),w:P.w,h:5},sw)){
          b.hp--;stompBounce();SFX.stomp();G.shakeT=12;burst(sw.x+8,sw.y,12,"#ffee58",3);
          if(b.hp<=0){b.phase=2;b.hp=3;b.t=0;b.atkT=0;setMsg("PHASE 2: 120V AC - ARC THE TRANSFER SWITCH!");
            SFX.grind();}
          else setMsg("BATTERY BANK "+(3-b.hp)+"/3 DISCONNECTED!");
        }
      } else b.sw=null;
    } else if(b.phase===2){
      // ensure the player can reach tier 3
      if(G.tier<3&&b.t%300===200&&!cur.ents.some(e=>e.type==="dogbone")){const d=spawnEnt("dogbone",b.x-120,roofY-40);d.vy=-1;}
      if(b.atkT%150===0){SFX.grind();fireShot({x:b.x-4,y:b.y+b.h-14,vx:-2.2,vy:0,type:"wave",hostile:true});}
      if(b.atkT%190===0){fireShot({x:P.x+P.w/2,y:cam.y-20,vx:0,vy:1,type:"acunit",hostile:true});SFX.hiss();}
      b.panelT=(b.panelT+1)%260;
      b.panelOpen=b.panelT<90;
      b.panel={x:b.x-6,y:b.y+50,w:12,h:22};
    } else if(b.phase===3){
      if(b.atkT%170===0){SFX.splash();fireShot({x:b.x-4,y:b.y+b.h-14,vx:-1.8,vy:0,type:"sludge",hostile:true});}
      if(b.atkT%260===130&&cur.ents.filter(e=>e.type==="goblin").length<3){
        const g=spawnEnt("goblin",b.x-30,b.y-30);g.vx=-0.8;}
      // three roof vents to cap with the wrench
      const wr2=wrenchRect();
      for(let i=0;i<3;i++){
        if(b.vents[i])continue;
        const v={x:b.x+30+i*40,y:roofY-10,w:18,h:10};
        if(wr2&&rectsOverlap(wr2,v)){
          b.vents[i]=true;SFX.big();G.shakeT=8;burst(v.x+9,v.y,12,"#f5f5f5",2);
          const left=3-b.vents.filter(Boolean).length;
          setMsg(left>0?"PENETRATION SEALED! ("+left+" LEFT)":"ALL SEALED - THE CURSE LIFTS!");
          if(left<=0){bossDefeated();return;}
        }
      }
    }
  }
}
function lemonArcHit(s){
  const b=cur.boss;
  if(!b||b.kind!=="lemon"||b.phase!==2||!b.panelOpen)return;
  if(rectsOverlap({x:s.x-3,y:s.y-3,w:6,h:6},b.panel)){
    s.on=false;b.hp--;SFX.pop();G.shakeT=14;burst(b.panel.x,b.panel.y+10,14,"#ffee58",3);
    if(b.hp<=0){b.phase=3;b.hp=3;b.t=0;b.atkT=0;
      setMsg("PHASE 3: PLUMBING - CAP THE ROOF VENTS!");SFX.deflate();}
    else setMsg("TRANSFER SWITCH HIT "+(3-b.hp)+"/3!");
  }
}
function bossDefeated(){
  const b=cur.boss;b.dead=true;SFX.big();G.shakeT=25;addScore(5000);
  for(let i=0;i<30;i++)spawnP(b.x+Math.random()*b.w,b.y+Math.random()*b.h,(Math.random()-0.5)*3,-Math.random()*3,60,i%2?"#ffd24a":"#eceff1",3);
  for(const s of shots)s.on=false;
  if(b.kind==="lemon"){G.mode="win";G.winT=0;setSong("title");}
  else {setMsg("SWAY CONTROLLED - RIG STABILIZED!");setTimeout(()=>{},0);levelClear();}
}

//================================================================ level clear
function levelClear(){
  if(G.mode!=="play")return;
  const so=G.soDone[G.levelIdx];
  const allSO=so[0]&&so[1]&&so[2];
  if(allSO)G.roClosed[G.levelIdx]=true;
  G.cleared[G.levelIdx]=true;
  const timeBonus=Math.floor(G.timer)*10;
  G.score+=timeBonus;
  G.tallyData={time:Math.floor(G.timer),timeBonus,so:so.slice(),allSO,label:cur.def.label};
  if(G.levelIdx===G.unlocked-1&&G.unlocked<LEVELS.length)G.unlocked++;
  G.checkpoint=null;
  G.mode="tally";G.winT=0;SFX.stamp();setSong("map");
  for(let i=0;i<20;i++)spawnP(P.x+(Math.random()-0.5)*60,P.y-20-Math.random()*40,(Math.random()-0.5)*2,-1-Math.random()*2,80,"#cfd8dc",2);
}

<script>
"use strict";
//================================================================ camera
const cam={x:0,y:0,look:0};
function updateCam(){

  if(cur.h*TS<=VH)cam.y=cur.h*TS-VH;
}
//================================================================ background
function drawBg(w,camx,camy){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  const interior=(w===WORLDS[7]);
  const night=(w===WORLDS[6]);
  // layer 1: far
  ctx.fillStyle=w.far;
  const o1=camx*0.15;
  for(let i=-1;i<8;i++){
    const bx=i*90-(o1%90);
    if(interior){ctx.fillRect(bx,40,60,VH);ctx.fillStyle="#222930";ctx.fillRect(bx+10,60,40,30);ctx.fillStyle=w.far;}
    else if(night){ctx.fillRect(bx,110-((i*37)%50),34,VH); // skyline
      ctx.fillStyle="#ffe082";for(let wnd=0;wnd<6;wnd++)if((i*7+wnd)%3===0)ctx.fillRect(bx+6+(wnd%2)*14,120+Math.floor(wnd/2)*16,4,5);ctx.fillStyle=w.far;}
    else {ctx.beginPath();ctx.moveTo(bx,190);ctx.lineTo(bx+45,90+((i*53)%40));ctx.lineTo(bx+90,190);ctx.fill();}
  }
  if(night){ctx.fillStyle="#fff";for(let i=0;i<40;i++)ctx.fillRect(((i*97)%VW),((i*61)%90),1,1);
    ctx.fillStyle="#fffde7";ctx.beginPath();ctx.arc(430,45,14,0,7);ctx.fill();}
  else if(!interior){ctx.fillStyle="rgba(255,255,255,0.85)";
    for(let i=0;i<4;i++){const cx2=((i*160+40)-(camx*0.1))%(VW+120)-60;ctx.fillRect(cx2,30+i*18,44,7);ctx.fillRect(cx2+8,26+i*18,26,7);}}
  // layer 2: mid — tree line or service shelving
  ctx.fillStyle=w.mid;
  const o2=camx*0.35;
  for(let i=-1;i<12;i++){
    const bx=i*56-(o2%56);
    if(interior){ctx.fillRect(bx,150,44,8);ctx.fillRect(bx,176,44,8);ctx.fillRect(bx+20,140,4,60);}
    else if(night){ctx.fillRect(bx,168,40,60);ctx.fillStyle="#ff4fd8";ctx.fillRect(bx+4,172,32,3);ctx.fillStyle=w.mid;}
    else{ctx.beginPath();ctx.arc(bx+20,180,22,3.14,0);ctx.fill();ctx.fillRect(bx+18,180,5,20);}
  }
  // layer 3: near — parked rig silhouettes / fences
  ctx.fillStyle=w.near;
  const o3=camx*0.6;
  for(let i=-1;i<10;i++){
    const bx=i*84-(o3%84);
    ctx.fillRect(bx,212,64,26); // rig body
    ctx.fillRect(bx+6,206,40,8);
    ctx.beginPath();ctx.arc(bx+14,240,7,0,7);ctx.arc(bx+50,240,7,0,7);ctx.fill();
  }
}
//================================================================ tiles
function drawTiles(){

        if(tileAt(tx,ty-1)!=="#"){ctx.fillStyle=w.acc;ctx.fillRect(px,py,TS,2);}
        ctx.fillStyle=w.gnd[1];ctx.fillRect(px+2,py+6,3,3);ctx.fillRect(px+9,py+11,3,3);break;
      case "X": ctx.fillStyle="#78909c";ctx.fillRect(px,py,TS,TS);ctx.fillStyle="#546e7a";ctx.fillRect(px+1,py+1,14,14);
        ctx.fillStyle="#90a4ae";ctx.fillRect(px+2,py+2,3,3);break;

        ctx.fillStyle="#a89f88";ctx.fillRect(px,py,1,TS);break;
      case "=": ctx.fillStyle="#bdb29a";ctx.fillRect(px,py,TS,5);ctx.fillStyle="#8d8470";ctx.fillRect(px,py+3,TS,2);break;
      case "*": ctx.fillStyle="#6d4c41";ctx.fillRect(px,py,TS,4);
        ctx.strokeStyle="#ffb74d";ctx.beginPath();ctx.moveTo(px,py+5);ctx.quadraticCurveTo(px+8,py+9,px+16,py+5);ctx.stroke();break;
      case "I": ctx.fillStyle="#b3e5fc";ctx.fillRect(px,py,TS,6);ctx.fillStyle="#e1f5fe";ctx.fillRect(px+2,py,3,4);break;
      case "_": ctx.fillStyle=w.gnd[0];ctx.fillRect(px,py,TS,TS);ctx.fillStyle="#80deea";ctx.fillRect(px,py,TS,3);
        ctx.fillStyle="#b2ebf2";ctx.fillRect(px+(G.frame/4+tx*5)%14,py,3,2);break;
      case "?": case "!": case "%": case "1": // storage bay hatch
        ctx.fillStyle="#90a4ae";ctx.fillRect(px,py,TS,TS);ctx.fillStyle="#607d8b";ctx.fillRect(px+1,py+1,14,14);
        ctx.fillStyle="#cfd8dc";ctx.fillRect(px+3,py+3,10,7);
        ctx.fillStyle="#37474f";ctx.fillRect(px+6,py+11,4,2);
        if(G.frame%60<40){ctx.fillStyle="#ffd54f";ctx.fillRect(px+7,py+5,2,3);}break;
      case "U": ctx.fillStyle="#78909c";ctx.fillRect(px,py,TS,TS);ctx.fillStyle="#546e7a";ctx.fillRect(px+2,py+2,12,12);break;
      case "L": ctx.fillStyle="#a1887f";ctx.fillRect(px+3,py,3,TS);ctx.fillRect(px+10,py,3,TS);
        ctx.fillRect(px+3,py+4,10,2);ctx.fillRect(px+3,py+11,10,2);break;
      case "A": ctx.fillStyle=(Math.floor(tx)%2)?"#ef5350":"#fafafa";ctx.fillRect(px,py,TS,6);
        ctx.fillStyle="#b71c1c";ctx.fillRect(px,py+5,TS,2);break;
      case "^": ctx.fillStyle="#90a4ae";
        ctx.beginPath();ctx.moveTo(px,py+16);ctx.lineTo(px+4,py+6);ctx.lineTo(px+8,py+16);ctx.lineTo(px+12,py+6);ctx.lineTo(px+16,py+16);ctx.fill();break;
      case "~": {const wob=Math.sin(G.frame*0.1+tx)*1.5;
        ctx.fillStyle="rgba(120,144,156,0.9)";ctx.fillRect(px,py+4+wob,TS,TS-4-wob);
        ctx.fillStyle="#b0bec5";ctx.fillRect(px,py+3+wob,TS,2);break;}
      case "V": ctx.fillStyle="#5d4037";ctx.fillRect(px-2,py-16,20,32);ctx.fillStyle="#8d6e63";ctx.fillRect(px,py-14,16,28);
        ctx.fillStyle="#fff";ctx.font="5px monospace";ctx.fillText("DUMP",px+1,py-6);ctx.fillText("STN",px+3,py+1);
        ctx.fillStyle="#ffd54f";ctx.fillText("v",px+6,py+10);break;
      case "E": { // service drop-off door: a rig with an open door
        ctx.fillStyle="#eceff1";ctx.fillRect(px-8,py-24,34,40);ctx.fillStyle="#607d8b";ctx.fillRect(px-8,py-24,34,4);
        ctx.fillStyle="#37474f";ctx.fillRect(px+2,py-12,14,28);
        ctx.fillStyle="#4caf50";ctx.fillRect(px-4,py-20,26,7);
        ctx.fillStyle="#fff";ctx.font="5px monospace";ctx.fillText("SERVICE",px-3,py-14);break;}
      case "W": ctx.fillStyle="#b0bec5";ctx.fillRect(px,py,TS,TS);ctx.fillStyle="#81d4fa";ctx.fillRect(px+2,py+2,12,12);
        ctx.fillStyle="#b0bec5";ctx.fillRect(px+7,py+2,2,12);break;
      case "w_open": ctx.fillStyle="#b0bec5";ctx.fillRect(px,py,TS,2);ctx.fillRect(px,py+14,TS,2);ctx.fillRect(px,py,2,TS);break;
      case "H": ctx.fillStyle="#eceff1";ctx.fillRect(px,py,TS,TS);ctx.fillStyle="#ef5350";ctx.fillRect(px+3,py+3,10,6);
        ctx.fillStyle="#607d8b";ctx.fillRect(px+5,py+10,6,4);
        if(G.frame%30<15){ctx.fillStyle="#ffab91";ctx.fillRect(px+6,py+4,4,3);}break;
    }
  }
  // bumps decay / ice crumble
  for(const b of cur.bumps){b.t--;
    if(b.ice&&b.t<=0&&tileAt(b.tx,b.ty)==="I"){setTile(b.tx,b.ty," ");burst(b.tx*TS+8,b.ty*TS+3,6,"#b3e5fc",1.5);SFX.clank();}}
  cur.bumps=cur.bumps.filter(b=>b.t>0);
  // signs
  ctx.font="6px monospace";
  for(const s of cur.signs){
    const sx=s.x-cam.x,sy=s.y-cam.y;
    if(sx<-300||sx>VW+40)continue;
    const tw=s.t.length*4+6;
    ctx.fillStyle="rgba(62,39,35,0.85)";ctx.fillRect(sx-2,sy-2,tw,11);
    ctx.fillStyle="#5d4037";ctx.fillRect(sx+tw/2-2,sy+9,3,8);
    ctx.fillStyle="#ffe9c9";ctx.fillText(s.t,sx+1,sy+6);
  }
}

function drawTorque(){
  if(P.invT>0&&(G.frame%6<3)&&G.mode==="play")return;
  const h=playerH(),x=P.x-cam.x-1,y=P.y-cam.y,f=P.face;
  ctx.save();ctx.translate(Math.round(x),Math.round(y));
  if(G.surgeT>0){ctx.fillStyle="rgba(255,238,88,0.35)";ctx.fillRect(-3,-3,P.w+8,h+6);}
  const body=G.tier===3?"#1565c0":"#37474f", trim=G.tier===3?"#ffd600":"#ff8f00";
  // legs (walk anim)
  const step=P.onGround&&Math.abs(P.vx)>0.2?Math.sin(P.anim*4)*2:0;
  ctx.fillStyle="#263238";
  ctx.fillRect(2,h-4,3,4+step);ctx.fillRect(7,h-4,3,4-step);
  // body/coveralls
  ctx.fillStyle=body;ctx.fillRect(1,h-12,10,9);
  ctx.fillStyle=trim;ctx.fillRect(1,h-12,10,2); // RVTI patch band
  // head
  ctx.fillStyle="#ffcc80";ctx.fillRect(2,h-18,8,6);
  ctx.fillStyle="#3e2723";ctx.fillRect(f>0?7:3,h-17,2,2); // eye
  if(G.tier>=2){ctx.fillStyle="#ffd600";ctx.fillRect(1,h-21,10,4);ctx.fillRect(f>0?8:-1,h-18,3,2);} // hard hat
  else {ctx.fillStyle="#8d6e63";ctx.fillRect(2,h-20,8,3);} // cap
  // wrench arm
  if(P.attackT>(G.impactT>0?3:5)){
    ctx.fillStyle="#b0bec5";
    ctx.fillRect(f>0?10:-14,h-11,14,3);
    ctx.fillRect(f>0?22:-16,h-13,3,7);
    if(G.tier===3){ctx.fillStyle="#ffee58";ctx.fillRect(f>0?20+Math.random()*4:-16-Math.random()*4,h-15,2,2);}
  } else {ctx.fillStyle="#b0bec5";ctx.fillRect(f>0?9:0,h-10,3,5);}
  if(P.gliding){ // little awning canopy
    ctx.fillStyle="#ef5350";ctx.fillRect(-3,-8,7,4);ctx.fillStyle="#fafafa";ctx.fillRect(4,-8,7,4);
    ctx.strokeStyle="#8d6e63";ctx.beginPath();ctx.moveTo(-2,-4);ctx.lineTo(5,0);ctx.moveTo(12,-4);ctx.lineTo(7,0);ctx.stroke();
  }
  if(P.slide>0){ctx.fillStyle="rgba(141,110,99,0.6)";ctx.fillRect(-4,h-3,4,3);}
  ctx.restore();
  if(G.surgeT>0){
    const words=["VOLTAGE OK","POLARITY OK","GROUND OK"];
    ctx.font="5px monospace";ctx.fillStyle="#00e676";
    ctx.fillText("• "+words[Math.floor(G.frame/30)%3]+" •",x-14,y-8);
  }
}

function drawBoss(){

    ctx.rotate(wob*0.012);
    ctx.fillStyle="#eceff1";ctx.fillRect(0,0,96,32);

  // THE LEMON

  if(b.phase===3){const px3=Math.sin(b.t*0.1)*8;ctx.fillStyle="#c0ca33";ctx.fillRect(-14-Math.max(0,px3),80,14+Math.max(0,px3),30);}

    ctx.fillRect(b.sw.x-b.x,b.sw.y-b.y,16,12);
    ctx.fillStyle="#fff";ctx.font="4px monospace";ctx.fillText("MAIN",b.sw.x-b.x+1,b.sw.y-b.y+8);}
  if(b.phase===2){
    ctx.fillStyle=b.panelOpen?"#212121":"#9e9d24";
    ctx.fillRect(-8,50,14,22);
    if(b.panelOpen&&G.frame%14<7){ctx.fillStyle="#ffee58";ctx.fillRect(-6,56,10,4);}
    ctx.fillStyle="#fff";ctx.font="4px monospace";ctx.fillText("XFER",-7,48);
  }
  if(b.phase===3)for(let i=0;i<3;i++){
    ctx.fillStyle=b.vents[i]?"#0277bd":"#78909c";
    ctx.fillRect(30+i*40,-10,18,10);
    if(!b.vents[i])spawnP(b.x+39+i*40,b.y-8,(Math.random()-0.5),0.8,20,"#64b5f6",1);
  }
  ctx.restore();
  ctx.fillStyle="#fff";ctx.font="7px monospace";
  ctx.fillText("THE LEMON  PHASE "+b.phase+"  "+"♥".repeat(Math.max(0,b.kind==="lemon"&&b.phase===3?3-b.vents.filter(Boolean).length:b.hp)),VW/2-60,18);
}
function drawShotsParts(){
  for(const s of shots){if(!s.on)continue;const x=s.x-cam.x,y=s.y-cam.y;
    switch(s.type){
      case "arc":ctx.fillStyle="#ffee58";ctx.fillRect(x-2,y-2,5,5);ctx.fillStyle="#fff";ctx.fillRect(x-1,y-1,2,2);break;
      case "paper":case "paperR":ctx.fillStyle="#fff";ctx.save();ctx.translate(x,y);ctx.rotate(s.life*0.2);ctx.fillRect(-4,-3,8,6);ctx.restore();break;
      case "spark":ctx.fillStyle="#ffee58";ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();break;
      case "shrap":ctx.fillStyle="#424242";ctx.fillRect(x-2,y-2,4,4);break;
      case "acunit":ctx.fillStyle="#eceff1";ctx.fillRect(x-8,y-5,16,10);ctx.fillStyle="#90a4ae";ctx.fillRect(x-6,y-3,12,3);break;
      case "wave":ctx.fillStyle="#ffcc80";ctx.beginPath();ctx.arc(x,y,6,3.14,0);ctx.fill();break;
      case "sludge":ctx.fillStyle="#5d4037";ctx.beginPath();ctx.arc(x,y,6,3.14,0);ctx.fill();
        ctx.fillStyle="#795548";ctx.fillRect(x-6,y-2,12,2);break;
    }}
  for(const p of particles){if(!p.on)continue;
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.t--;if(p.t<=0){p.on=false;continue;}
    ctx.globalAlpha=Math.min(1,p.t/20);
    ctx.fillStyle=p.color;ctx.fillRect(p.x-cam.x,p.y-cam.y,p.size,p.size);ctx.globalAlpha=1;}
}
//================================================================ HUD
function drawWrenchIcon(x,y,c){ctx.fillStyle=c;ctx.fillRect(x,y+3,9,2);ctx.fillRect(x-1,y+1,3,6);ctx.fillRect(x+8,y+1,3,2);ctx.fillRect(x+8,y+5,3,2);}
function drawHUD(){
  ctx.fillStyle="rgba(0,0,0,0.35)";ctx.fillRect(0,0,VW,22);
  ctx.font="8px monospace";ctx.fillStyle="#fff";
  // lives
  drawWrenchIcon(6,6,"#eceff1");ctx.fillText("x"+G.lives,20,14);
  // rods
  ctx.fillStyle="#cfd8dc";ctx.fillRect(44,7,3,9);ctx.fillStyle="#fff";ctx.fillText("x"+G.rods,50,14);
  // score
  ctx.fillText(String(G.score).padStart(7,"0"),84,14);
  // tier plug
  const tx=160;
  ctx.fillStyle=G.tier===3?"#fdd835":G.tier===2?"#eceff1":"#78909c";
  ctx.fillRect(tx,6,12,8);ctx.fillRect(tx+3,3,2,4);ctx.fillRect(tx+7,3,2,4);
  ctx.fillStyle="#fff";ctx.fillText(G.tier===3?"50A":G.tier===2?"30A":"FLAT",tx+15,14);
  if(G.tier===3){ctx.fillStyle="#37474f";ctx.fillRect(tx+42,7,34,7);
    ctx.fillStyle="#fdd835";ctx.fillRect(tx+43,8,32*(G.power/100),5);}
  // tank monitor (combo multiplier)
  const mx=282,glitch=G.glitchT>0;
  ctx.fillStyle="#263238";ctx.fillRect(mx-3,4,64,15);
  ctx.font="5px monospace";
  const labels=["FRESH","GRAY","BLACK"];
  for(let i=0;i<3;i++){
    let lit=G.combo>i; if(glitch)lit=(G.frame%10<5)?!lit:lit;
    ctx.fillStyle=lit?["#4fc3f7","#b0bec5","#8d6e63"][i]:"#455a64";
    ctx.fillRect(mx+i*20,6,14,5);
    ctx.fillStyle="#90a4ae";ctx.fillText(labels[i],mx+i*20-1,17);
  }
  ctx.font="8px monospace";ctx.fillStyle="#fff";ctx.fillText("x"+(1+G.combo),mx+62,14);
  if(glitch&&G.frame%20<10){ctx.font="5px monospace";ctx.fillStyle="#ff8a80";ctx.fillText("SENSOR MISREAD - JUST LIKE THE REAL THING",mx-120,21);}
  // timer + label
  ctx.font="8px monospace";ctx.fillStyle=G.timer<50?"#ff8a80":"#fff";
  ctx.fillText("T"+String(Math.max(0,Math.floor(G.timer))).padStart(3,"0"),VW-46,14);
  ctx.fillStyle="#fff";ctx.fillText(cur.def.label,VW-80,14);
  // shield/impact chips
  let cx3=6;
  if(G.shieldEB){ctx.fillStyle="#fafafa";ctx.beginPath();ctx.arc(cx3+4,30,5,0,7);ctx.fill();cx3+=14;}
  if(G.impactT>0){ctx.fillStyle="#f57f17";ctx.fillRect(cx3,26,10,8);cx3+=14;}
  if(G.greaseT>0){ctx.fillStyle="#8bc34a";ctx.fillRect(cx3,26,10,8);cx3+=14;}
  // message
  if(G.msgT>0){ctx.font="8px monospace";
    const tw=G.msg.length*5;
    ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(VW/2-tw/2-4,30,tw+8,14);
    ctx.fillStyle="#ffe082";ctx.fillText(G.msg,VW/2-tw/2,40);}
}
//================================================================ screens
function bigText(t,x,y,size,color,shadow){
  ctx.font="bold "+size+"px monospace";
  if(shadow!==false){ctx.fillStyle="#000";ctx.fillText(t,x+2,y+2);}
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}
function center(t,y,size,color){ctx.font="bold "+size+"px monospace";
  const w2=ctx.measureText(t).width;bigText(t,(VW-w2)/2,y,size,color);}
function drawTitle(){
  const t=G.frame;
  drawBg(WORLDS[1],t*8,0);
  ctx.fillStyle="rgba(0,0,0,0.25)";ctx.fillRect(0,0,VW,VH);
  center("RIG RUNNER",92,42,"#ffd600");
  center("A VALVE STEM VALLEY REPAIR-EM-UP",112,9,"#ffe9c9");
  if(t%60<40)center("PRESS START  (ENTER / Z / TAP)",150,11,"#fff");
  ctx.font="8px monospace";ctx.fillStyle="#eceff1";
  const rows=["ARROWS/WASD MOVE   SHIFT RUN   Z/SPACE JUMP",
              "X/J WRENCH & ARC-FLASH   DOWN CRAWL   ENTER PAUSE   M MUTE"];
  rows.forEach((r,i)=>{const w2=ctx.measureText(r).width;ctx.fillText(r,(VW-w2)/2,190+i*13);});
  center("HI SCORE "+String(G.hiScore).padStart(7,"0"),226,9,"#ffe082");

}
function drawMap(){
  // campground loop road
  ctx.fillStyle="#1b3a24";ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#254a2e";for(let i=0;i<50;i++)ctx.fillRect((i*83)%VW,(i*47)%VH,3,3);
  center("VALVE STEM VALLEY - SITE MAP",24,13,"#ffe082");
  ctx.strokeStyle="#8d6e63";ctx.lineWidth=8;ctx.beginPath();
  MAP_NODES.forEach((n,i)=>{i===0?ctx.moveTo(n.x,n.y):ctx.lineTo(n.x,n.y);});
  ctx.stroke();ctx.lineWidth=1;
  MAP_NODES.forEach((n,i)=>{
    const lv=LEVELS[i],unlocked=i<G.unlocked;
    ctx.fillStyle=G.cleared[i]?"#4caf50":unlocked?"#ffd600":"#546e7a";
    ctx.beginPath();ctx.arc(n.x,n.y,9,0,7);ctx.fill();
    ctx.fillStyle="#000";ctx.font="7px monospace";ctx.fillText(lv.label,n.x-8,n.y+3);
    if(G.roClosed[i]){ctx.fillStyle="#a5d6a7";ctx.font="6px monospace";ctx.fillText("R.O. CLOSED",n.x-18,n.y-13);}
    if(i===G.mapSel){ctx.strokeStyle="#fff";ctx.beginPath();ctx.arc(n.x,n.y,12+Math.sin(G.frame*0.15)*2,0,7);ctx.stroke();
      // Torque marker
      ctx.fillStyle="#37474f";ctx.fillRect(n.x-4,n.y-26,8,10);ctx.fillStyle="#ffd600";ctx.fillRect(n.x-5,n.y-30,10,4);}
  });
  const lv=LEVELS[G.mapSel];
  center(WORLDS[lv.world].name+" - "+lv.name,VH-32,10,"#fff");
  center("ARROWS SELECT   ENTER/Z START",VH-14,8,"#b0bec5");
}
function drawPause(){
  ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,VW,VH);
  center("PAUSED",100,26,"#ffd600");
  center("ENTER RESUME   M MUTE"+(AU.muted?" (MUTED)":""),128,9,"#fff");
  ctx.fillStyle="rgba(255,255,255,0.08)";ctx.fillRect(0,180,VW,30);
  ctx.font="8px monospace";ctx.fillStyle="#ffe9c9";
  const tip=TIPS[G.tipIdx];
  const scroll=(G.tipT*0.8)%(tip.length*5+VW);
  ctx.fillText(tip,VW-scroll,199);
}
function drawValve(){
  ctx.fillStyle="rgba(0,0,0,0.75)";ctx.fillRect(0,0,VW,VH);
  const v=G.valve;
  center("DUMP STATION",56,18,"#ffe082");
  center("PULL THE VALVES IN THE CORRECT ORDER",76,9,"#fff");
  center("(LEFT = BLACK   RIGHT = GRAY)",90,8,"#b0bec5");
  // two valve handles
  const opts=[["BLACK","#3e2723",170],["GRAY","#78909c",300]];
  for(const [name,color,x] of opts){
    const pulled=v.pulled.includes(name);
    ctx.fillStyle="#455a64";ctx.fillRect(x,120,42,14);
    ctx.fillStyle=color;ctx.fillRect(x+(pulled?26:2),116,20,22);
    ctx.fillStyle="#fff";ctx.font="8px monospace";ctx.fillText(name,x+2,150);
    if(pulled){ctx.fillStyle="#8d6e63";
      for(let i=0;i<4;i++)ctx.fillRect(x+8+((G.frame*3+i*17)%30),160+i*3,6,3);}
  }
  if(v.result==="win"){center("BLACK FIRST, GRAY RINSE - PERFECT DUMP!",196,10,"#69f0ae");
    center("+500 PTS  +25 ANODE RODS",212,9,"#fff");}
  else if(v.result==="lose"){center("GRAY FIRST?! NOW NOTHING RINSES THE HOSE.",196,10,"#ff8a80");
    center("(THE SPLASH WAS HUMILIATING BUT HARMLESS)",212,8,"#b0bec5");
    ctx.fillStyle="rgba(144,164,174,0.35)";ctx.fillRect(0,VH-40-((v.t*2)%60),VW,80);}
  else center("JUMP/ESC TO BACK OUT",230,8,"#546e7a");
}
function drawTally(){
  ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,0,VW,VH);
  const t=G.tallyData;
  // the magnet slap
  ctx.fillStyle="#eceff1";ctx.fillRect(VW/2-70,52,140,34);
  center("SERVICE COMPLETE",74,15,"#c62828");
  center("LEVEL "+t.label+" CLEARED!",110,12,"#ffd600");
  center("TIME LEFT: "+t.time+"  BONUS +"+t.timeBonus,132,9,"#fff");
  let so="SERVICE ORDERS: ";
  for(let i=0;i<3;i++)so+=t.so[i]?"[✓]":"[ ]";
  center(so,150,9,t.allSO?"#69f0ae":"#b0bec5");
  if(t.allSO)center("*** R.O. CLOSED ***",168,11,"#69f0ae");

  if(G.winT>60&&G.frame%40<28)center("PRESS ENTER",224,9,"#fff");
}
function drawGameOver(){
  ctx.fillStyle="#101014";ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle="#f5f0e6";ctx.fillRect(96,28,320,232);
  ctx.fillStyle="#333";
  ctx.font="bold 12px monospace";ctx.fillText("VALVE STEM VALLEY RV SERVICE",118,52);
  ctx.font="7px monospace";ctx.fillText("REPAIR INVOICE #"+(1000+((G.score)%9000)),118,66);
  ctx.fillText("CUST: TORQUE (RVTI CERT.)",118,76);
  ctx.strokeStyle="#999";ctx.beginPath();ctx.moveTo(112,84);ctx.lineTo(400,84);ctx.stroke();
  ctx.font="8px monospace";
  const lines=[
    ["LABOR: "+3+" LIVES @ 1 EA","3 LIVES"],
    ["PARTS: ANODE RODS RECOVERED",String(G.rods)],
    ["SHOP SUPPLIES: PRIDE","1 EA"],
    ["DIAG FEE: SCORE",String(G.score)],
    ["FREIGHT: HI SCORE",String(G.hiScore)],
  ];
  lines.forEach((l,i)=>{ctx.fillText(l[0],118,102+i*16);ctx.fillText(l[1],340,102+i*16);});
  ctx.strokeStyle="#999";ctx.beginPath();ctx.moveTo(112,188);ctx.lineTo(400,188);ctx.stroke();
  ctx.font="bold 10px monospace";ctx.fillText("TOTAL DUE: ONE MORE TRY?",118,208);
  ctx.font="7px monospace";ctx.fillStyle="#777";ctx.fillText("ALL WARRANTIES VOID. ESPECIALLY YOURS.",118,222);
  if(G.frame%50<35){ctx.fillStyle="#c62828";ctx.font="bold 9px monospace";ctx.fillText("PRESS ENTER TO AUTHORIZE REPAIRS",140,244);}
}
function drawWin(){
  drawBg(WORLDS[7],0,0);
  G.winT++;
  const t=G.winT;
  // the Lemon rolls off, cured
  const lx=VW/2-80+Math.min(t,300)*0.8;
  ctx.fillStyle="#cddc39";ctx.fillRect(lx,150,160,70);
  ctx.fillStyle="#37474f";ctx.fillRect(lx+6,158,30,18);
  ctx.fillStyle="#616161";ctx.beginPath();ctx.arc(lx+34,222,11,0,7);ctx.arc(lx+120,222,11,0,7);ctx.fill();
  ctx.fillStyle="#2e7d32";ctx.fillRect(lx+60,164,34,20);
  ctx.fillStyle="#fff";ctx.font="6px monospace";ctx.fillText("PDI",lx+70,172);ctx.fillText("PASSED",lx+64,181);
  center("R.O. CLOSED - NO PARTS PENDING",70,16,"#69f0ae");
  center("THE LEMON'S CHECK-ENGINE LIGHT IS DARK.",96,9,"#fff");
  center("VALVE STEM VALLEY ROLLS AGAIN.",110,9,"#fff");
  center("FINAL SCORE "+String(G.score).padStart(7,"0"),136,12,"#ffe082");
  if(t>140&&G.frame%40<28)center("PRESS ENTER",250,9,"#fff");
  for(let i=0;i<2;i++)if(t%6===0)spawnP(Math.random()*VW+cam.x,cam.y+Math.random()*80,0,1,60,i?"#ffd600":"#cfd8dc",2);
  drawShotsParts();
}
//================================================================ flow
function resetGame(){
  G.lives=3;G.score=0;G.rods=0;G.tier=1;G.shieldEB=false;G.impactT=0;G.greaseT=0;G.surgeT=0;G.power=0;
  G.combo=0;G.checkpoint=null;
  G.soDone=LEVELS.map(()=>[false,false,false]);G.roClosed=LEVELS.map(()=>false);G.cleared=LEVELS.map(()=>false);
  G.unlocked=Math.max(G.unlocked,1);
}
function startLevel(i){G.levelIdx=i;soCounter=0;loadLevel(i,false);G.mode="play";}
function update(){
  G.frame++;
  if(G.msgT>0)G.msgT--;
  if(G.glitchT>0)G.glitchT--;else if(Math.random()<0.0012)G.glitchT=70;
  musicTick();
  switch(G.mode){
    case "title":
      setSong("title");
      if(kEdge.pause||kEdge.jump){SFX.plug();resetGame();G.mode="map";setSong("map");}
      break;
    case "map":
      if(kEdge.l||kEdge.u){do{G.mapSel=(G.mapSel+LEVELS.length-1)%LEVELS.length;}while(G.mapSel>=G.unlocked);SFX.clank();}
      if(kEdge.r||kEdge.d){G.mapSel=(G.mapSel+1)%LEVELS.length;if(G.mapSel>=G.unlocked)G.mapSel=0;SFX.clank();}
      if(kEdge.pause||kEdge.jump){SFX.plug();startLevel(G.mapSel);}
      break;
    case "play":
      if(kEdge.pause){G.mode="pause";G.tipIdx=Math.floor(Math.random()*TIPS.length);G.tipT=0;break;}
      G.timer-=DT;
      if(G.timer<=0){G.timer=0;killPlayer();break;}
      if(G.comboT>0){G.comboT--;if(G.comboT<=0)G.combo=0;}
      if(cur.windy){
        if(cur.gustT>0)cur.gustT--;
        else if(Math.random()<0.004){cur.gustT=120;cur.gustW=Math.random()<0.5?-1:1;SFX.hiss();}
      }
      updatePlayer();
      if(G.mode!=="play")break;
      updateEnts();
      for(const e of cur.ents)if(e.y>cur.h*TS+60)e.dead=true;
      cur.ents=cur.ents.filter(e=>!e.dead);
      updateShots();
      updateBoss();
      updateCam();
      if(G.shakeT>0)G.shakeT--;
      break;
    case "pause":
      G.tipT++;
      if(G.tipT%700===699)G.tipIdx=(G.tipIdx+1)%TIPS.length;
      if(kEdge.pause)G.mode="play";
      break;
    case "valve": updateValve();break;
    case "dead":
      G.deathT++;
      P.vy+=0.25;P.y+=P.vy;
      if(G.deathT>140){
        G.lives--;
        if(G.lives<=0){G.hiScore=Math.max(G.hiScore,G.score);G.mode="gameover";setSong(null);}
        else {loadLevel(G.levelIdx,true);G.mode="play";
          if(G.tier>1)G.tier=1; // respawn at base tier
        }
      }
      break;
    case "tally":
      G.winT++;
      if(G.winT>60&&(kEdge.pause||kEdge.jump)){G.hiScore=Math.max(G.hiScore,G.score);
        G.mapSel=Math.min(G.unlocked-1,LEVELS.length-1);G.mode="map";setSong("map");}
      break;
    case "gameover":
      if(kEdge.pause||kEdge.jump){G.mode="title";setSong("title");}
      break;
    case "win":
      if(G.winT>140&&(kEdge.pause||kEdge.jump)){G.hiScore=Math.max(G.hiScore,G.score);
        G.cleared[G.levelIdx]=true;G.mode="title";setSong("title");}
      break;
  }
  kEdge.jump=false;kEdge.act=false;kEdge.pause=false;kEdge.u=false;kEdge.d=false;kEdge.l=false;kEdge.r=false;kEdge.any=false;
}
function draw(){
  ctx.clearRect(0,0,VW,VH);
  switch(G.mode){
    case "title": drawTitle();return;
    case "map": drawMap();return;
    case "gameover": drawGameOver();return;
    case "win": drawWin();return;
  }
  if(!cur)return;
  ctx.save();
  if(G.shakeT>0)ctx.translate((Math.random()-0.5)*4,(Math.random()-0.5)*4);
  drawBg(cur.world,cam.x,cam.y);
  drawTiles();
  for(const e of cur.ents)drawEnt(e);
  drawBoss();
  if(G.mode!=="dead"||G.frame%4<2)drawTorque();
  drawShotsParts();
  ctx.restore();
  drawHUD();
  if(G.mode==="pause")drawPause();
  if(G.mode==="valve")drawValve();
  if(G.mode==="tally")drawTally();
}
//================================================================ main loop
let last=performance.now(),acc=0;
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-last)/1000; last=t;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  let n=0;
  while(acc>=DT&&n<4){update();acc-=DT;n++;}
  draw();
}
requestAnimationFrame(frame);
</script>
